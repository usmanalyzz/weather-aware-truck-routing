[project]
name = "weather-truck-routing-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "Django==5.2.18",
    "djangorestframework==3.18.3",
    "django-cors-headers==4.9.0",
    "httpx==0.28.1",
    "flexpolyline==0.1.0",
    "python-dotenv==1.2.4",
    "gunicorn==23.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["risk", "routing", "weather", "providers", "trips"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]
