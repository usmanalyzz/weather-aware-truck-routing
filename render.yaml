# Render Blueprint: Django REST API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: weather-truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One process keeps the in-memory cache shared (plan -> heatmap reuse); threads handle concurrent I/O.
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: HERE_API_KEY
        sync: false # set in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://weather-aware-truck-routing.vercel.app
